name: flutter_app
description: Ludo Master - online multiplayer ludo game with FastAPI backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  get_it: ^8.0.0
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.1.2
  audioplayers: ^6.1.0
  share_plus: ^13.3.0
  app_links: ^7.2.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
